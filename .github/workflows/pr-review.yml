name: PR Review
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    concurrency:
      group: pr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Pinned to an agent-tools commit, and the rubric read from the same commit. Bump both SHAs
    # together in agent-tools; the weekly sync then updates every repo.
    uses: payready/agent-tools/.github/workflows/pr-review.yml@0e524c287502b3a4220a030202c7fa4710b36a89
    with:
      prompt_ref: 0e524c287502b3a4220a030202c7fa4710b36a89
    # Only the secrets the reusable workflow declares; never `inherit`, which would hand every
    # org secret this repo can see (deploy keys, automation tokens) to agent-tools code.
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SYNC_APP_ID: ${{ secrets.SYNC_APP_ID }}
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

  reply:
    if: >-
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        !contains(github.event.issue.labels.*.name, 'skip-review')
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        !contains(github.event.pull_request.labels.*.name, 'skip-review')
      )
    concurrency:
      group: pr-reply-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.comment.id }}
      cancel-in-progress: false
    # Pinned to an agent-tools commit, and the rubric read from the same commit. Bump both SHAs
    # together in agent-tools; the weekly sync then updates every repo.
    uses: payready/agent-tools/.github/workflows/pr-review-reply.yml@0e524c287502b3a4220a030202c7fa4710b36a89
    with:
      prompt_ref: 0e524c287502b3a4220a030202c7fa4710b36a89
    # Only the secrets the reusable workflow declares; never `inherit`, which would hand every
    # org secret this repo can see (deploy keys, automation tokens) to agent-tools code.
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SYNC_APP_ID: ${{ secrets.SYNC_APP_ID }}
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
